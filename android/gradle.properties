org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# Use AGP built-in Kotlin for the app and plugins
android.builtInKotlin=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.jvm.target.validation.mode=warning
# Keep the supported AGP DSL enabled through Flutter's automatic migration
android.newDsl=true
